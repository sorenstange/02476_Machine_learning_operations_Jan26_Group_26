#config.yaml

defaults:
  - experiments: exp1
  - _self_

project_name: rice-classifier
seed : 42

data_parameters:
  dataset_raw_path: Rice_Image_Dataset
  dataset_processed_path: data
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  augmentation:
    shape: [224, 224]
    mean: 0.5
    std: 0.5

training_parameters:
  epochs: 30
  batch_size: 32
  learning_rate: 1e-4
  num_workers: 4
  optimizer: adam

model_parameters:
  model_name: custom_cnn
  parameters:
    input_channels: 1
    conv_layers: [16, 32, 64, 128]
    fc_layers: [256, 128]
    output_dim: 5
  