name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements_tests.txt

    - name: Create test model
      run: |
        mkdir -p models
        python -c "
        import torch
        from src.model import CNN_Model
        model = CNN_Model(parameters={'learning_rate': 0.0001, 'input_channels': 1, 'output_dim': 5, 'input_size': (224, 224), 'conv_layers': [16, 32, 64, 128], 'fc_layers': [256, 128]})
        torch.save(model.state_dict(), 'models/rice_classifier.pth')
        "

    - name: Run tests
      run: pytest test_api.py -v
