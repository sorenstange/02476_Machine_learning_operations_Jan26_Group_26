name: "Run tests"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_tests.txt
          pip list

      - name: Create test model
        run: |
          python -c "
          import torch
          from pathlib import Path
          from src.model import CNN_Model
          Path('models').mkdir(exist_ok=True)
          model = CNN_Model(parameters={'learning_rate': 0.0001, 'input_channels': 1, 'output_dim': 5, 'input_size': (224, 224), 'conv_layers': [16, 32, 64, 128], 'fc_layers': [256, 128]})
          torch.save(model.state_dict(), 'models/rice_classifier.pth')
          "

      - name: Test with pytest
        run: |
          pytest -v
