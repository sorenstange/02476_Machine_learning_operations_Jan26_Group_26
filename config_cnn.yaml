# config_gpu.yaml
# run with: gcloud ai custom-jobs create --region=europe-west1 --display-name=cnn-run --config=config_cnn.yaml
workerPoolSpecs:
- machineSpec:
    machineType: n1-standard-8
    acceleratorType: NVIDIA_TESLA_T4
    acceleratorCount: 1
  replicaCount: 1
  containerSpec:
    imageUri: europe-north2-docker.pkg.dev/robust-charge-484208-t4/m21-container-registry/train-cnn:latest
    env:
    - name: WANDB_API_KEY
      value: "${WANDB_API_KEY}"